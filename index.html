<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"JG+ Architects (demo)"}</script>
<style>
:root{--bg:#F4F1EA;--sf:#EAE5DA;--tx:#1D1D1B;--mu:#6F6A61;--ch:#242421;--st:#B7B0A2;--cl:#9A6F4D;--wd:#6B513D;--fo:#4D5B48;--p:clamp(20px,5vw,72px)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;line-height:1.04;letter-spacing:-.01em}
h1{font-size:clamp(2.8rem,8vw,7rem)}h2{font-size:clamp(2rem,4.6vw,3.8rem)}h3{font-size:clamp(1.5rem,2.6vw,2.1rem)}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cl);outline-offset:3px}
.wrap{padding:0 var(--p)}section{padding:clamp(64px,10vw,140px) 0}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--wd)}
.mu{color:var(--mu)}.lead{font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:56ch;color:var(--mu)}
.sr{position:absolute;left:-9999px}
/* header */
header{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:20px var(--p);color:#fff;transition:background .4s,color .4s,padding .4s}
header.solid{background:var(--bg);color:var(--tx);padding:14px var(--p);border-bottom:1px solid var(--sf)}
.logo{text-decoration:none;display:flex;align-items:baseline;gap:10px}.logo b{font:500 1.7rem 'Cormorant Garamond',serif}.logo i{font-style:normal;font-size:.65rem;letter-spacing:.3em}
nav ul{display:flex;gap:clamp(20px,3vw,44px);list-style:none;font-size:.88rem;letter-spacing:.06em}
nav a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent;transition:border-color .3s}nav a:hover,nav a[aria-current]{border-color:currentColor}
.burger{display:none;background:none;border:0;padding:10px;cursor:pointer;font-size:.8rem;letter-spacing:.14em;color:inherit}
@media(max-width:767px){.burger{display:block}nav{position:fixed;inset:0;background:var(--ch);color:var(--bg);display:none;align-items:center;padding:0 var(--p)}nav.open{display:flex}nav ul{flex-direction:column;gap:18px;font:400 2.6rem 'Cormorant Garamond',serif}header.menu{color:var(--bg);background:transparent;border:0}.burger,.logo{position:relative;z-index:60}}
/* placeholder art + images */
.ph,.im{position:relative;overflow:hidden;background:var(--st)}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:14px;bottom:14px;background:rgba(244,241,234,.92);color:var(--ch);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px}
/* hero */
.hero{min-height:100svh;padding:0;display:flex;align-items:flex-end;color:#fff;position:relative}.hero .ph,.hero .im{position:absolute;inset:0}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,18,.7),rgba(20,20,18,.05) 55%)}
.hero .in{position:relative;z-index:2;padding:0 var(--p) clamp(48px,8vw,96px);max-width:1200px}.hero h1{margin-bottom:.25em}.hero .sub{font:italic 400 clamp(1.4rem,3vw,2.2rem) 'Cormorant Garamond',serif;margin-bottom:18px}.hero p.c{max-width:48ch;opacity:.9;margin-bottom:32px}
.btn{display:inline-block;text-decoration:none;padding:15px 30px;font-size:.85rem;letter-spacing:.1em;border:1px solid currentColor;margin:0 12px 12px 0;background:none;cursor:pointer;transition:background .3s,color .3s}
.btn.f{background:var(--bg);color:var(--ch);border-color:var(--bg)}.btn.f:hover{background:transparent;color:#fff}.btn:hover{background:var(--tx);color:var(--bg)}
.btn.d{background:var(--ch);color:var(--bg);border-color:var(--ch)}.btn.d:hover{background:var(--wd)}
/* grids */
.split{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(24px,6vw,96px);align-items:start}@media(max-width:767px){.split{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,4vw,56px) clamp(16px,2vw,32px);margin-top:48px}
.card{grid-column:span 6;text-decoration:none;display:block}.card:nth-child(3n+1){grid-column:span 7}.card:nth-child(3n+2){grid-column:span 5;margin-top:clamp(0px,6vw,96px)}
.card .im,.card .ph{aspect-ratio:4/3}.card:hover .im img{transform:scale(1.04)}
.card h3{margin:16px 0 4px}.meta{font-size:.82rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 16px}
@media(max-width:767px){.card,.card:nth-child(n){grid-column:1/-1;margin-top:0}}
.prin{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--st);margin-top:48px}.prin div{padding:28px 24px 28px 0;border-bottom:1px solid var(--st)}.prin h3{font-size:1.7rem;margin-bottom:6px}@media(max-width:767px){.prin{grid-template-columns:1fr 1fr}}
.dark{background:var(--ch);color:var(--bg)}.dark .mu,.dark .lead{color:var(--st)}.dark .eyebrow{color:var(--st)}
.svc{border-top:1px solid var(--st);display:grid;grid-template-columns:70px 1fr 1.4fr;gap:20px;padding:26px 0;align-items:baseline}.svc:last-child{border-bottom:1px solid var(--st)}.svc .n{font-size:.8rem;color:var(--mu)}
.svc p{color:var(--mu);max-width:52ch;opacity:.0;transform:translateY(6px);transition:.4s}.svc:hover p,.svc:focus-within p{opacity:1;transform:none}.svc.v p{opacity:1;transform:none}
@media(hover:none),(max-width:767px){.svc p{opacity:1;transform:none}.svc{grid-template-columns:40px 1fr}.svc p{grid-column:2}}
.unv{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--wd);border:1px solid var(--st);padding:2px 7px;margin-left:10px;vertical-align:middle;font-family:Inter,sans-serif}
/* project page */
.ph-hero{height:88svh;min-height:480px}.ph-hero .ph,.ph-hero .im{height:100%}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-bottom:1px solid var(--st);padding:28px 0}.facts dt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.facts dd{font:400 1.3rem 'Cormorant Garamond',serif}@media(max-width:767px){.facts{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;list-style:none}.chips li{border:1px solid var(--st);padding:4px 12px;font-size:.82rem}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:40px}.gal>*{grid-column:span 2;aspect-ratio:4/5}.gal>*:nth-child(3n+1){grid-column:span 3;aspect-ratio:4/3}.gal>*:nth-child(3n+2){grid-column:span 3;aspect-ratio:4/3}@media(max-width:767px){.gal>*,.gal>*:nth-child(n){grid-column:span 6;aspect-ratio:4/3}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:40px}.dr{background:var(--sf);aspect-ratio:1;position:relative}.dr svg{width:100%;height:100%}.dr span{position:absolute;left:14px;bottom:12px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.next{display:block;text-decoration:none;padding:clamp(56px,9vw,120px) var(--p);background:var(--sf)}
/* forms */
form{display:grid;grid-template-columns:1fr 1fr;gap:26px 24px}.fld{display:flex;flex-direction:column;gap:6px}.fld.w{grid-column:1/-1}@media(max-width:767px){form{grid-template-columns:1fr}}
label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--st);padding:10px 0;border-radius:0;min-height:44px}textarea{min-height:120px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--tx)}
.err{color:#8a2b1f;font-size:.82rem;min-height:1em}.ok{padding:18px;background:var(--sf);grid-column:1/-1}
footer{background:var(--ch);color:var(--st);padding:64px var(--p) 36px;font-size:.88rem}footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}@media(max-width:767px){footer .g{grid-template-columns:1fr}}footer a{color:var(--bg)}footer .off{opacity:.45;cursor:not-allowed}footer ul{list-style:none;display:grid;gap:6px}
.demo{font-size:.78rem;border-top:1px solid #3a3a36;margin-top:36px;padding-top:20px}
/* motion */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s}.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style></head>
<body>
<a class="sr" href="#main" onclick="event.preventDefault();document.getElementById('main').focus()">Skip to content</a>
<header id="hd"><a class="logo" href="#/" aria-label="JG+ Architects home"><b>JG+</b><i>ARCHITECTS</i></a>
<button class="burger" id="bg" aria-expanded="false" aria-controls="nv">MENU</button>
<nav id="nv" aria-label="Main"><ul><li><a href="#/projects" data-r="projects">Projects</a></li><li><a href="#/studio" data-r="studio">Studio</a></li><li><a href="#/services" data-r="services">Services</a></li><li><a href="#/contact" data-r="contact">Contact</a></li></ul></nav></header>
<main id="main" tabindex="-1"></main>
<footer id="ft"></footer>
<noscript><p style="padding:120px 24px">This demo site needs JavaScript enabled.</p></noscript>
<script>
(()=>{
const $=s=>document.querySelector(s),M=$('#main'),H=$('#hd'),N=$('#nv'),B=$('#bg');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=['#B7B0A2','#9A6F4D','#6B513D','#4D5B48','#8C8677'];let D;
const cap=p=>p.status==='REAL'?'':'<span class="tag">Demo / Reference project</span>';
const art=(i)=>{const c=T[i%5];return `<div class="ph" style="background:linear-gradient(160deg,${c},#2b2a26)" role="img" aria-label="Placeholder for architectural photograph"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" fill="none" stroke="rgba(244,241,234,.35)" stroke-width="1"><rect x="60" y="70" width="280" height="170"/><rect x="150" y="110" width="100" height="90"/><path d="M60 70 200 20 340 70M150 110V240M250 110V240"/></svg>`};
const img=(src,alt,i,tag)=>src?`<div class="im"><img src="${E(src)}" alt="${E(alt)}" loading="lazy">${tag||''}</div>`:art(i)+(tag||'')+'</div>';
const pc=(p,i)=>`<a class="card rv" href="#/project/${p.slug}">${img(p.image,p.name+' — placeholder image',i,cap(p))}<h3>${E(p.name)}</h3><div class="meta"><span>${E(p.category)}</span><span>${E(p.location)}</span><span>${E(p.year)}</span></div></a>`;
const sv=(s,i,n)=>`<div class="svc rv ${s.verified?'v':''}"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${E(s.name)}${s.verified?'':'<span class="unv">Pending confirmation</span>'}</h3><p>${E(s.description)}</p></div>`;
const cta=()=>`<section class="dark"><div class="wrap"><p class="eyebrow">Enquiries</p><h2 style="margin:14px 0 24px;max-width:14em">${E(D.contactPage.headline)}</h2><p class="lead" style="margin-bottom:32px">${E(D.contactPage.text)}</p><a class="btn f" href="#/contact">Start a Project</a></div></section>`;
const dr=(t,i)=>`<div class="dr"><svg viewBox="0 0 200 200" fill="none" stroke="#9c9587" stroke-width=".8" role="img" aria-label="${E(t)} drawing placeholder"><rect x="30" y="40" width="140" height="120"/>${i%2?'<path d="M30 100H170M100 40V160M60 40V100"/>':'<rect x="75" y="75" width="50" height="50"/><path d="M30 40 75 75M170 40 125 75M30 160 75 125M170 160 125 125"/>'}</svg><span>${E(t)} · placeholder</span></div>`;
const R={
'':()=>{const h=D.hero,P=D.projects;return `<section class="hero">${img(h.image,'Architecture hero',0,'')}<div class="in"><p class="eyebrow" style="color:#ddd;margin-bottom:18px">Demo concept · Periya, Kerala</p><h1>${E(h.headline)}</h1><p class="sub">${E(h.sub)}</p><p class="c">${E(h.copy)}</p><a class="btn f" href="#/projects">Explore Projects</a><a class="btn" href="#/contact">Start a Project</a></div></section>
<section><div class="wrap split"><div><p class="eyebrow">The studio</p></div><div class="rv"><h2>${E(D.studio.headline)}</h2><p class="lead" style="margin-top:24px">${E(D.studio.body)}</p><a class="btn" style="margin-top:28px" href="#/studio">About the studio</a></div></div></section>
<section style="padding-top:0"><div class="wrap"><p class="eyebrow">Featured projects · demo</p><div class="pgrid">${P.slice(0,3).map(pc).join('')}</div><a class="btn" href="#/projects">All projects</a></div></section>
<section class="dark"><div class="wrap"><p class="eyebrow">Architectural principles</p><div class="prin">${D.studio.principles.map(x=>`<div class="rv"><h3>${E(x[0])}</h3><p class="mu">${E(x[1])}</p></div>`).join('')}</div><p class="mu" style="margin-top:20px;font-size:.8rem">${E(D.studio.placeholderNote)}</p></div></section>
<section><div class="wrap"><p class="eyebrow" style="margin-bottom:32px">Selected services · pending client confirmation</p>${D.services.slice(0,4).map(sv).join('')}<a class="btn" style="margin-top:32px" href="#/services">All services</a></div></section>${cta()}`},
projects:()=>{const P=D.projects;return `<section style="padding-top:160px"><div class="wrap"><p class="eyebrow">Projects · ${P.length} demo / reference</p><h1 style="margin:14px 0 20px">Selected work</h1><p class="lead">Placeholder case studies showing how projects could be presented. They are not JG+ Architects commissions.</p><ul class="chips" id="flt" aria-label="Filter projects"><li><button class="btn d" data-f="" style="margin:0;padding:6px 14px">All</button></li>${[...new Set(P.flatMap(p=>p.tags))].map(t=>`<li><button class="btn" data-f="${E(t)}" style="margin:0;padding:6px 14px">${E(t)}</button></li>`).join('')}</ul><p class="meta" id="cnt" aria-live="polite" style="margin-top:16px">${P.length} projects</p><div class="pgrid" id="pg">${P.map(pc).join('')}</div></div></section>`},
studio:()=>`<section style="padding-top:160px"><div class="wrap"><p class="eyebrow">Studio</p><h1 style="margin:14px 0 28px">${E(D.studio.headline)}</h1><p class="lead">${E(D.studio.body)}</p></div></section>
<section class="dark"><div class="wrap"><p class="eyebrow">Design philosophy</p><div class="prin">${D.studio.principles.map(x=>`<div><h3>${E(x[0])}</h3><p class="mu">${E(x[1])}</p></div>`).join('')}</div></div></section>
<section><div class="wrap"><p class="eyebrow">Approach</p><div class="prin" style="grid-template-columns:repeat(4,1fr)">${D.studio.approach.map((x,i)=>`<div><span class="mu">0${i+1}</span><h3>${E(x[0])}</h3><p class="mu">${E(x[1])}</p></div>`).join('')}</div></div></section>
<section style="padding-top:0"><div class="wrap split"><div><p class="eyebrow">Team</p></div><div>${D.team.map((m,i)=>`<div style="display:flex;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--st)"><div style="width:84px;flex:none">${img(m.photo,m.name,i,'')}</div><div><h3 style="font-size:1.6rem">${E(m.name)}</h3><p class="mu">${E(m.role)} · bio pending</p></div></div>`).join('')}</div></div></section>
<section style="padding-top:0"><div class="wrap split"><div><p class="eyebrow">Context</p></div><div><h2>Kerala, Kasaragod</h2><p class="lead" style="margin-top:20px">Monsoon rain, strong sun, humidity and dense planting shape how buildings here should sit, breathe and shade themselves.</p><p class="mu" style="margin-top:16px">${E(D.location.line)}<br><small>${E(D.location.note)}</small></p></div></div></section>`,
services:()=>`<section style="padding-top:160px"><div class="wrap"><p class="eyebrow">Services · placeholder</p><h1 style="margin:14px 0 28px">What we could offer</h1><p class="lead" style="margin-bottom:56px">This list is illustrative. JG+ Architects must confirm which services are actually offered.</p>${D.services.map(sv).join('')}</div></section>
<section class="dark"><div class="wrap"><p class="eyebrow">Process</p><div class="prin" style="grid-template-columns:repeat(4,1fr)">${D.studio.approach.map((x,i)=>`<div><span class="mu">0${i+1}</span><h3>${E(x[0])}</h3><p class="mu">${E(x[1])}</p></div>`).join('')}</div></div></section>${cta()}`,
contact:()=>{const C=D.contact,ch=[C.email&&`<a href="mailto:${E(C.email)}">${E(C.email)}</a>`,C.phone&&`<a href="tel:${E(C.phone)}">${E(C.phone)}</a>`].filter(Boolean);const f=(id,l,t='text',x='',w='')=>`<div class="fld ${w}"><label for="${id}">${l}</label><input id="${id}" name="${id}" type="${t}" ${x}><span class="err" id="e-${id}"></span></div>`;
return `<section style="padding-top:160px"><div class="wrap split"><div><p class="eyebrow">Contact</p><h1 style="margin:14px 0 24px;font-size:clamp(2.4rem,5vw,4.4rem)">${E(D.contactPage.headline)}</h1><p class="lead">${E(D.contactPage.text)}</p><p style="margin-top:36px">${ch.length?ch.join('<br>'):'<span class="mu">Direct email, phone and WhatsApp to be confirmed by the client.</span>'}</p><p class="mu" style="margin-top:20px">${E(D.location.line)}<br><small>${E(D.location.note)}</small></p></div>
<form id="fm" novalidate>${f('name','Name','text','required autocomplete="name"')}${f('email','Email','email','required autocomplete="email"')}${f('phone','Phone','tel','autocomplete="tel"')}<div class="fld"><label for="type">Project type</label><select id="type" name="type">${D.contactPage.types.map(t=>`<option>${E(t)}</option>`).join('')}</select></div>${f('loc','Project location')}${f('area','Approximate area')}${f('time','Timeline')}<div class="fld"><label for="bud">Budget range</label><select id="bud"><option>Prefer to discuss</option><option>Under ₹50 lakh</option><option>₹50 lakh – ₹1.5 crore</option><option>₹1.5 crore +</option></select></div><div class="fld w"><label for="msg">Message</label><textarea id="msg" required></textarea><span class="err" id="e-msg"></span></div><div class="fld w"><label style="text-transform:none;letter-spacing:0;font-size:.9rem;display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="cons" style="min-height:0;margin-top:5px"> I agree to be contacted about this enquiry.</label><span class="err" id="e-cons"></span></div><div class="fld w"><button class="btn d" type="submit">Send Enquiry</button></div><div id="res" class="w" style="grid-column:1/-1" role="status"></div></form></div></section>`},
project:s=>{const P=D.projects,i=P.findIndex(p=>p.slug===s);if(i<0)return null;const p=P[i],n=P[(i+1)%P.length];document.title=p.name+' — JG+ Architects';return `<div class="ph-hero">${img(p.image,p.name+' — placeholder image',i,cap(p))}</div>
<section style="padding-bottom:0"><div class="wrap"><p class="eyebrow">${E(p.category)}</p><h1 style="margin:12px 0 32px">${E(p.name)}</h1><dl class="facts"><div><dt>Category</dt><dd>${E(p.category)}</dd></div><div><dt>Location</dt><dd>${E(p.location)}</dd></div><div><dt>Year</dt><dd>${E(p.year)}</dd></div><div><dt>Status</dt><dd>${p.status==='REAL'?'Completed':'Demo / Reference'}</dd></div></dl></div></section>
<section><div class="wrap split"><div><p class="eyebrow">Architectural story</p></div><div><p class="serif" style="font-size:clamp(1.5rem,2.8vw,2.3rem);line-height:1.25">${E(p.long||p.short)}</p><ul class="chips">${p.themes.map(t=>`<li>${E(t)}</li>`).join('')}</ul></div></div></section>
<section class="dark"><div class="wrap"><p class="eyebrow">Plans & sections</p><div class="dgrid">${p.drawings.map(dr).join('')}</div></div></section>
<section><div class="wrap"><p class="eyebrow">Gallery</p><div class="gal">${p.gallery.map((g,k)=>{const src=typeof g==='string'&&/[\/.]/.test(g)?g:'';return img(src,p.name+' — '+g,k+i,src?'':'<span class="tag">'+E(String(g).replace(/-/g,' '))+'</span>')}).join('')}</div></div></section>
<a class="next" href="#/project/${n.slug}"><p class="eyebrow">Next project</p><h2 style="margin-top:12px">${E(n.name)} →</h2></a>`}
};
function foot(){const soc=D.social.map(s=>s.verified&&s.url&&s.url!=='#'?`<li><a href="${E(s.url)}" rel="noopener">${E(s.label)}</a></li>`:`<li><span class="off" title="Official account to be confirmed">${E(s.label)} · pending</span></li>`).join('');

function route(){const h=location.hash.replace(/^#\/?/,''),[k,arg]=h.split('/');let out=null,name=k||'';document.title='JG+ Architects | Architecture & Residential Design';
if(name==='project')out=R.project(arg);else if(R[name])out=R[name]();
if(out===null||out===undefined){out=`<section style="padding-top:180px"><div class="wrap"><h1>Not found</h1><p class="lead" style="margin:20px 0">That page doesn't exist.</p><a class="btn d" href="#/">Home</a></div></section>`;name='x'}
else if(name&&name!=='project'){document.title=name[0].toUpperCase()+name.slice(1)+' — JG+ Architects'}
M.innerHTML=out;N.classList.remove('open');H.classList.remove('menu');B.setAttribute('aria-expanded','false');B.textContent='MENU';
document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===name));
scrollTo(0,0);M.focus({preventScroll:true});H.dataset.home=(name===''||name==='project')?'1':'';sc();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});M.querySelectorAll('.rv').forEach(e=>io.observe(e));
const fl=$('#flt');if(fl)fl.onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.f;fl.querySelectorAll('button').forEach(x=>x.classList.toggle('d',x===b));const L=D.projects.filter(p=>!t||p.tags.includes(t));$('#pg').innerHTML=L.map(pc).join('');$('#cnt').textContent=L.length+(L.length===1?' project':' projects');document.querySelectorAll('#pg .rv').forEach(e=>e.classList.add('on'))};
const fm=$('#fm');if(fm)fm.onsubmit=e=>{e.preventDefault();let ok=true;const v=(id,bad,m)=>{$('#e-'+id).textContent=bad?m:'';if(bad)ok=false};
v('name',!$('#name').value.trim(),'Please enter your name.');v('email',!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('#email').value),'Please enter a valid email.');v('msg',!$('#msg').value.trim(),'Please tell us a little about the project.');v('cons',!$('#cons').checked,'Please confirm consent.');
$('#res').innerHTML=ok?'<div class="ok">Thank you. This is a demo: the form validates but does not send anything yet. A real email destination will be connected once the client confirms one.</div>':''}}

addEventListener('scroll',sc,{passive:true});addEventListener('hashchange',route);
B.onclick=()=>{const o=N.classList.toggle('open');H.classList.toggle('menu',o);B.setAttribute('aria-expanded',o);B.textContent=o?'CLOSE':'MENU';sc()};
fetch('data/content.json').then(r=>r.json()).then(d=>{D=d;foot();route()}).catch(()=>{M.innerHTML='<section style="padding-top:180px"><div class="wrap"><h1>Content failed to load</h1><p class="lead">Please refresh.</p></div></section>'});
})();
